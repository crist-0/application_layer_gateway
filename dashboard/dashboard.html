<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gateway Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #161A22;
    --panel: #1D2330;
    --border: #2A3140;
    --text: #DCE1EA;
    --muted: #7D879A;
    --amber: #E0A94D;
    --teal: #4FB8AA;
    --red: #D9695F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  header h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header .status {
    font-size: 12px;
    color: var(--muted);
  }
  header .status .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--teal);
    margin-right: 6px;
  }

  main {
    padding: 24px 28px 60px;
    max-width: 1180px;
    margin: 0 auto;
  }

  .filters {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .filters input, .filters select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    padding: 7px 10px;
    border-radius: 4px;
    outline: none;
  }
  .filters input::placeholder { color: var(--muted); }
  .filters input:focus, .filters select:focus { border-color: var(--teal); }
  .filters button {
    background: var(--teal);
    color: #0E1319;
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
  }
  .filters button:hover { opacity: 0.88; }
  .filters .clear {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .charts {
    display: grid;
    grid-template-columns: 1.3fr 1fr 1fr;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin-bottom: 28px;
  }
  .chart-box {
    background: var(--panel);
    padding: 16px 18px 8px;
  }
  .chart-box .label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
  }
  .chart-box canvas { max-height: 170px; }

  .summary-row {
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
    margin-bottom: 28px;
  }
  .summary-cell {
    flex: 1;
    padding: 14px 18px;
    border-right: 1px solid var(--border);
  }
  .summary-cell:last-child { border-right: none; }
  .summary-cell .n {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 600;
  }
  .summary-cell .l {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
  }
  thead th {
    text-align: left;
    color: var(--muted);
    font-weight: 500;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
  }
  tbody td {
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  .tag {
    padding: 1px 7px;
    border-radius: 3px;
    font-size: 11px;
  }
  .tag.traffic { background: rgba(79,184,170,0.15); color: var(--teal); }
  .tag.security { background: rgba(224,169,77,0.15); color: var(--amber); }
  .status-ok { color: var(--teal); }
  .status-err { color: var(--red); }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <h1>Gateway Dashboard</h1>
  <div class="status"><span class="dot"></span>live · refreshes every 5s</div>
</header>

<main>

  <div class="filters">
    <input type="text" id="f-ip" placeholder="IP address" />
    <select id="f-type">
      <option value="">All types</option>
      <option value="traffic">Traffic</option>
      <option value="security">Security</option>
    </select>
    <input type="text" id="f-since" placeholder="Since (unix ms)" />
    <button onclick="applyFilters()">Filter</button>
    <button class="clear" onclick="clearFilters()">Clear</button>
  </div>

  <div class="summary-row" id="summary"></div>

  <div class="charts">
    <div class="chart-box">
      <div class="label"><span>Requests over time</span></div>
      <canvas id="chartTimeline"></canvas>
    </div>
    <div class="chart-box">
      <div class="label"><span>Status codes</span></div>
      <canvas id="chartStatus"></canvas>
    </div>
    <div class="chart-box">
      <div class="label"><span>Security events by source</span></div>
      <canvas id="chartSource"></canvas>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>IP</th>
        <th>Method</th>
        <th>Path</th>
        <th>Type</th>
        <th>Detail</th>
      </tr>
    </thead>
    <tbody id="eventRows"></tbody>
  </table>
  <div class="empty" id="emptyState" style="display:none;">No events match the current filters.</div>

</main>

<script>
  let timelineChart, statusChart, sourceChart;

  function buildQuery() {
    const params = new URLSearchParams();
    const ip = document.getElementById('f-ip').value.trim();
    const type = document.getElementById('f-type').value;
    const since = document.getElementById('f-since').value.trim();
    if (ip) params.set('ip', ip);
    if (type) params.set('type', type);
    if (since) params.set('since', since);
    return params.toString();
  }

  function applyFilters() { loadEvents(); }

  function clearFilters() {
    document.getElementById('f-ip').value = '';
    document.getElementById('f-type').value = '';
    document.getElementById('f-since').value = '';
    loadEvents();
  }

  async function loadEvents() {
    const query = buildQuery();
    const res = await fetch('/api/events' + (query ? '?' + query : ''));
    const events = await res.json();
    render(events);
  }

  function render(events) {
    renderSummary(events);
    renderTable(events);
    renderTimeline(events);
    renderStatusChart(events);
    renderSourceChart(events);
  }

  function renderSummary(events) {
    const traffic = events.filter(e => e.type === 'traffic');
    const security = events.filter(e => e.type === 'security');
    const errors = traffic.filter(e => e.statusCode >= 500);
    const uniqueIps = new Set(events.map(e => e.ip)).size;

    document.getElementById('summary').innerHTML = `
      <div class="summary-cell"><div class="n">${events.length}</div><div class="l">total events</div></div>
      <div class="summary-cell"><div class="n">${traffic.length}</div><div class="l">traffic</div></div>
      <div class="summary-cell"><div class="n">${security.length}</div><div class="l">security</div></div>
      <div class="summary-cell"><div class="n">${errors.length}</div><div class="l">5xx responses</div></div>
      <div class="summary-cell"><div class="n">${uniqueIps}</div><div class="l">unique IPs</div></div>
    `;
  }

  function renderTable(events) {
    const rows = [...events].sort((a, b) => b.timestamp - a.timestamp).slice(0, 200);
    const tbody = document.getElementById('eventRows');
    document.getElementById('emptyState').style.display = rows.length ? 'none' : 'block';

    tbody.innerHTML = rows.map(e => {
      const time = new Date(e.timestamp).toLocaleTimeString();
      const tag = `<span class="tag ${e.type}">${e.type}</span>`;
      const detail = e.type === 'traffic'
        ? `<span class="${e.statusCode >= 500 ? 'status-err' : 'status-ok'}">${e.statusCode}</span>`
        : `${e.source} — ${e.reason}`;
      return `<tr>
        <td>${time}</td>
        <td>${e.ip}</td>
        <td>${e.method}</td>
        <td>${e.path}</td>
        <td>${tag}</td>
        <td>${detail}</td>
      </tr>`;
    }).join('');
  }

  function bucketByMinute(events) {
    const buckets = {};
    events.forEach(e => {
      const minute = Math.floor(e.timestamp / 60000) * 60000;
      buckets[minute] = (buckets[minute] || 0) + 1;
    });
    const keys = Object.keys(buckets).sort((a, b) => a - b);
    return {
      labels: keys.map(k => new Date(Number(k)).toLocaleTimeString()),
      data: keys.map(k => buckets[k])
    };
  }

  function renderTimeline(events) {
    const { labels, data } = bucketByMinute(events);
    if (timelineChart) timelineChart.destroy();
    timelineChart = new Chart(document.getElementById('chartTimeline'), {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data,
          borderColor: '#4FB8AA',
          backgroundColor: 'rgba(79,184,170,0.12)',
          fill: true,
          tension: 0.25,
          pointRadius: 0,
          borderWidth: 2
        }]
      },
      options: baseChartOptions(false)
    });
  }

  function renderStatusChart(events) {
    const counts = {};
    events.filter(e => e.type === 'traffic').forEach(e => {
      counts[e.statusCode] = (counts[e.statusCode] || 0) + 1;
    });
    const labels = Object.keys(counts);
    const data = Object.values(counts);
    const colors = labels.map(code => code >= 500 ? '#D9695F' : code >= 400 ? '#E0A94D' : '#4FB8AA');

    if (statusChart) statusChart.destroy();
    statusChart = new Chart(document.getElementById('chartStatus'), {
      type: 'bar',
      data: { labels, datasets: [{ data, backgroundColor: colors, borderRadius: 3 }] },
      options: baseChartOptions(false)
    });
  }

  function renderSourceChart(events) {
    const counts = {};
    events.filter(e => e.type === 'security').forEach(e => {
      counts[e.source] = (counts[e.source] || 0) + 1;
    });
    const labels = Object.keys(counts);
    const data = Object.values(counts);

    if (sourceChart) sourceChart.destroy();
    sourceChart = new Chart(document.getElementById('chartSource'), {
      type: 'bar',
      data: { labels, datasets: [{ data, backgroundColor: '#E0A94D', borderRadius: 3 }] },
      options: baseChartOptions(true)
    });
  }

  function baseChartOptions(horizontal) {
    return {
      indexAxis: horizontal ? 'y' : 'x',
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#7D879A', font: { size: 10 } }, grid: { color: '#2A3140' } },
        y: { ticks: { color: '#7D879A', font: { size: 10 } }, grid: { color: '#2A3140' }, beginAtZero: true }
      }
    };
  }

  loadEvents();
  setInterval(loadEvents, 5000);
</script>

</body>
</html>
